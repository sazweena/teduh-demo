<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Teduh | Elmina pilot</title>
<link rel="icon" href="./assets/teduh-icon.svg" type="image/svg+xml">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* Layout: a working product. Planner website (sidebar + main) and resident phone, switchable or side by side. */
:root{
  --bg:#eef3f0; --surface:#ffffff; --surface-2:#f4f8f6; --ink:#13211c; --muted:#5a6b64; --line:#d5e0da;
  --accent:#0d6b5b; --accent-ink:#ffffff; --accent-soft:#d9eee8; --side:#12302a; --side-ink:#d7ece5; --side-on:#1e4a40;
  --host:#34405a; --host-ink:#ffffff; --host-soft:#e7eaf1; --stage:#dfe7e3;
  --cool:#2e9d6c; --warm:#e0a019; --hot:#d2412a; --night:#4b5f8a; --brown:#7a6a58;
  --map-bg:#e9eee8; --map-night:#1b2430; --block:#d7ddd6; --block-night:#2a3443; --park:#bfe0c4; --park-night:#22382c;
  --water:#bcd9ea; --water-night:#1f3448; --road-case:#ffffff; --road-case-night:#0f151d; --label:#33433d; --label-night:#c9d4e2;
  --shadow:rgba(10,40,30,.35);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1613; --surface:#14201c; --surface-2:#1a2924; --ink:#e3ede8; --muted:#94a69f; --line:#29392f;
  --accent:#3ec3a4; --accent-ink:#06231c; --accent-soft:#16382f; --side:#0a1714; --side-ink:#bcd6cd; --side-on:#173a32;
  --host:#a9b6d3; --host-ink:#121826; --host-soft:#222a3a; --stage:#0a120f;
  --map-bg:#1a2420; --block:#26332d; --park:#1f3a2a; --water:#1d3444; --road-case:#0e1512; --label:#c4d2cb; --shadow:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1613; --surface:#14201c; --surface-2:#1a2924; --ink:#e3ede8; --muted:#94a69f; --line:#29392f;
  --accent:#3ec3a4; --accent-ink:#06231c; --accent-soft:#16382f; --side:#0a1714; --side-ink:#bcd6cd; --side-on:#173a32;
  --host:#a9b6d3; --host-ink:#121826; --host-soft:#222a3a; --stage:#0a120f;
  --map-bg:#1a2420; --block:#26332d; --park:#1f3a2a; --water:#1d3444; --road-case:#0e1512; --label:#c4d2cb; --shadow:rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:24px;font-weight:800} h3{font-size:16px;font-weight:800} h4{font-size:14px;font-family:var(--body);font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .note{font-size:12px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* switcher */
.switch{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom, 0px));left:max(12px, env(safe-area-inset-left, 0px));z-index:60;display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px -12px var(--shadow)}
.switch button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.switch .sep{width:1px;background:var(--line);margin:2px 2px}

.root{min-height:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:100vh}
.split .stage{border-left:1px solid var(--line);padding-bottom:60px}

/* staff */
.staff{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh;position:relative;background:var(--bg)}
.side{background:var(--side);color:var(--side-ink);padding:16px 10px;display:flex;flex-direction:column;gap:3px}
.logo{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font-family:var(--display);font-weight:800;font-size:20px;color:#fff}
.logo img{width:32px;height:34px;object-fit:contain;display:block;flex:none}
.navb{border:0;background:transparent;color:var(--side-ink);text-align:left;padding:9px 11px;border-radius:9px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.navb:hover{background:var(--side-on)}
.navb[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.cnt{font-family:var(--mono);font-size:11px;background:var(--hot);color:#fff;padding:0 6px;border-radius:6px}
.navb .cnt.soft{background:rgba(255,255,255,.18)}
.side .foot{margin-top:auto;font-size:11.5px;opacity:.7;padding:8px}
.mainwrap{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;padding-right:max(22px, calc(env(safe-area-inset-right, 0px) + 22px))}
.topbar select{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);font-weight:700}
.topbar .sp{flex:1}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-weight:800}
.iconbtn .cnt{position:absolute;top:-6px;right:-6px}
.avatar{border:0;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800}
.dropdown{position:absolute;top:56px;right:70px;width:330px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -18px var(--shadow);z-index:30;padding:8px;display:flex;flex-direction:column;gap:4px}
.dditem{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:10px;align-items:flex-start;font-size:13px;width:100%}
.dditem:hover{background:var(--surface-2)}
.main{padding:20px 22px 80px;display:flex;flex-direction:column;gap:16px;min-width:0}
.main.map-main{padding-bottom:12px;gap:10px}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mh p{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);text-align:left}
button.kpi:hover{border-color:var(--accent)}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0}
.rowbtn{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 2px;width:100%;font-size:13.5px}
.rowbtn:last-of-type{border-bottom:0}
.rowbtn:hover{background:var(--surface-2)}
.rowbtn small{display:block;color:var(--muted);font-size:12px}
svg.map{display:block;width:100%;height:auto;border-radius:10px;background:var(--map-bg)}
svg.map.night{background:var(--map-night)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.st-Received{background:var(--surface-2)}
.st-Seen{background:color-mix(in srgb,var(--night) 22%,transparent);border-color:transparent}
.st-Planned{background:color-mix(in srgb,var(--warm) 26%,transparent);border-color:transparent}
.st-Built{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.new{background:var(--hot);color:#fff;border-color:transparent}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 13px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.slider{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.slider input{flex:1;accent-color:var(--accent)}
.big{font-family:var(--display);font-weight:800;font-size:19px;min-width:78px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--surface)}
.chk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ramp{display:inline-block;width:90px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--cool),var(--warm),var(--hot));vertical-align:middle;margin:0 6px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.track{height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%}
.rank{font-family:var(--mono);font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px;color:#fff}
.sname{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.05}
.reason{font-size:13.5px;background:var(--surface-2);border-left:3px solid var(--hot);padding:9px 12px;border-radius:0 8px 8px 0}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:13.5px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.out td{opacity:.45}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tick{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);font-size:12px;font-weight:800;background:var(--surface)}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.compare{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.ic{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;flex:none}
.tabsf{display:flex;gap:6px;flex-wrap:wrap}
.tabsf button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700}
.tabsf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pillar{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;background:var(--surface)}
.pillar b{display:block;font-size:14px}
.ba{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ba div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.ba small{display:block;font-size:12px;color:var(--muted)}
.ba b{font-family:var(--display);font-size:24px;font-weight:800}
.later{font-size:13px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted)}
.srcs{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}

.scrim{position:fixed;inset:0;left:210px;background:rgba(8,20,16,.28);z-index:20}
.split .scrim{right:420px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:25;display:flex;flex-direction:column;box-shadow:-20px 0 40px -30px var(--shadow)}
.split .drawer{right:420px}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px}
.dbody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:32px;height:32px;font-weight:800}
.photo{border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:block}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700}
.stepper button.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.stepper button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);resize:vertical;min-height:64px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist li{border-left:2px solid var(--line);padding-left:10px}
.hist small{display:block;color:var(--muted)}

.modalwrap{position:fixed;inset:0;background:rgba(8,20,16,.45);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:min(520px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -30px var(--shadow)}
.modal textarea{font-family:var(--mono);font-size:12px;min-height:150px}
.modal.pitch-modal{width:min(610px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;gap:16px}
.pitch-modal .pitch-step{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.pitch-modal h3{font-family:var(--display);font-size:25px;line-height:1.1;margin:0}
.pitch-modal p{font-size:13px;line-height:1.5;color:var(--muted)}
.pitch-budget{display:grid;gap:11px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2)}
.pitch-budget-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700}
.pitch-budget-head strong{font-family:var(--display);font-size:27px;font-variant-numeric:tabular-nums}
.pitch-budget input{width:100%;accent-color:var(--accent)}
.pitch-budget-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pitch-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pitch-stats div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.pitch-stats strong{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pitch-stats span{display:block;font-size:11px;color:var(--muted)}
.pitch-result-list{display:grid;gap:7px;max-height:320px;overflow:auto}
.pitch-result-row{display:flex;justify-content:space-between;gap:12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px}
.pitch-result-row.pilot{border-color:var(--accent);background:var(--accent-soft)}
.pitch-result-row strong{display:block;font-size:13px}
.pitch-result-row small{display:block;color:var(--muted);margin-top:3px}
.pitch-result-row b{white-space:nowrap;font-variant-numeric:tabular-nums}
.pitch-progress{height:9px;overflow:hidden;border-radius:99px;background:var(--line)}
.pitch-progress span{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;animation:pitch-calc 1.3s linear both}
@keyframes pitch-calc{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
@media(max-width:520px){.modal.pitch-modal{padding:17px}.pitch-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.pitch-stats strong{font-size:16px}}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:90;box-shadow:0 12px 30px -12px var(--shadow);max-width:calc(100% - 32px)}

/* phone */
.stage{background:var(--stage);display:flex;justify-content:center;align-items:flex-start;padding:30px 16px 80px;min-height:100vh}
.phone{width:375px;max-width:100%;border:11px solid #0f1714;border-radius:48px;background:var(--surface);overflow:hidden;box-shadow:0 30px 60px -30px var(--shadow);position:relative}
.scr{height:760px;max-height:calc(100vh - 120px);min-height:600px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:14px;background:#0f1714;z-index:5}
.status{display:flex;justify-content:space-between;align-items:center;padding:11px 24px 4px;font-size:12px;font-weight:700;font-family:var(--mono)}
.pbody{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.pbar{display:flex;align-items:center;gap:10px;padding:4px 16px 8px}
.pbar .teduh-mark{width:28px;height:28px;padding:3px;border-radius:8px;background:var(--side);object-fit:contain;flex:none}
.back{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-weight:800;font-size:18px;line-height:1}
.pbar .t{font-weight:800;font-size:16px;display:block}
.pbar .s{font-size:11px;color:var(--muted);display:block}
.pnav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:6px 6px 14px}
.pnav button{border:0;background:transparent;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-weight:600}
.pnav i{width:20px;height:20px;border-radius:6px;background:var(--line);display:block}
.pnav button[aria-current="true"]{color:var(--host)} .pnav button[aria-current="true"] i{background:var(--host)}
.pnav .cnt{position:absolute;top:-4px;right:calc(50% - 22px)}
.hosthead{background:var(--host);color:var(--host-ink);margin:-8px -16px 0;padding:14px 18px 18px;display:flex;flex-direction:column;gap:2px}
.hosthead small{opacity:.8}
.hosthead b{font-family:var(--display);font-size:22px}
.unit{background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center;font-size:11.5px;font-weight:600;line-height:1.25;position:relative}
.tile i{display:block;width:30px;height:30px;border-radius:9px;margin:0 auto 6px;background:var(--host-soft)}
.tile.teduh{border:2px solid var(--accent);background:var(--accent-soft)}
.tile.teduh .tile-mark{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 6px;border-radius:9px;background:var(--side)}
.tile.teduh .tile-mark img{width:28px;height:28px;object-fit:contain}
.badge{position:absolute;top:-7px;right:-5px;background:var(--hot);color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:999px}

const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pth=s=>"M"+s.pts.map(p=>p.join(",")).join(" L");
const mid=s=>{const i=Math.floor((s.pts.length-1)/2),a=s.pts[i],b=s.pts[i+1];return[(a[0]+b[0])/2,(a[1]+b[1])/2];};
const shadedPct=extra=>{let a=0,b=0;S.forEach(s=>{a+=s.len*shade(s,14,extra);b+=s.len;});return Math.round(100*a/b);};
const redCount=extra=>S.filter(s=>score(s,"day",14,extra)>=65).length;
function planSet(budget=st.budget,useManual=true){let left=budget;const pick=new Set();FIXES.forEach(s=>{if(s.fix.cost<=left){pick.add(s.id);left-=s.fix.cost;}});
 if(useManual)Object.entries(st.manual).forEach(([id,on])=>{on?pick.add(id):pick.delete(id);});return pick;}
function portfolio(budget){const pick=planSet(budget,false);let cost=0,trips=0;pick.forEach(id=>{const s=byId[id];cost+=s.fix.cost;trips+=daily(s);});return {pick,cost,trips,remaining:budget-cost};}
function pitchStats(budget){const p=portfolio(budget);return `<div class="pitch-stats"><div><strong>${p.pick.size}</strong><span>fixes selected</span></div><div><strong>${rmFull(p.cost)}</strong><span>allocated</span></div><div><strong>${p.trips.toLocaleString()}</strong><span>estimated daily trips</span></div></div>`;}

function mapSVG({mode=st.mode,hour=st.hour,sel=null,attr="",showReports=true,showFixes=true,colour=true,pin=null,home=false,vb="0 0 640 440",override={},cls="map",onlyMine=false}={}){
 const night=mode==="night";const B=night?"var(--block-night)":"var(--block)",PK=night?"var(--park-night)":"var(--park)",W=night?"var(--water-night)":"var(--water)",L=night?"var(--label-night)":"var(--label)",RC=night?"var(--road-case-night)":"var(--road-case)";
 let g=`<path d="M20,250 Q60,230 200,240 L210,425 L20,425 Z" fill="${PK}"/><ellipse cx="520" cy="350" rx="70" ry="45" fill="${W}"/>`;
 [[30,120,80,50],[130,120,80,50],[30,62,80,40],[130,62,60,40],[230,70,60,100],[310,70,60,100],[380,70,70,100],[470,70,60,22],[470,110,60,60],[555,70,60,100],[230,190,60,100],[310,190,60,100],[390,190,40,40],[230,310,140,60],[390,310,40,60],[500,190,110,40],[490,250,70,40]].forEach(b=>g+=`<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="3" fill="${B}"/>`);
 S.forEach(s=>g+=`<path d="${pth(s)}" fill="none" stroke="${RC}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>`);
 S.forEach(s=>{const c=override[s.id]||(colour?col(score(s,mode,hour)):"var(--line)");const on=s.id===sel;if(on)g+=`<path d="${pth(s)}" fill="none" stroke="${c}" stroke-opacity=".3" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>`;g+=`<path d="${pth(s)}" fill="none" stroke="${c}" stroke-width="${on?9:7}" stroke-linecap="round" stroke-linejoin="round"/>`;});
 const t=(x,y,s)=>`<text x="${x}" y="${y}" font-family="Figtree,sans-serif" font-size="11" font-weight="700" fill="${L}" text-anchor="middle" pointer-events="none">${s}</text>`;
 g+=t(265,100,"SK Elmina")+t(525,274,"Lakeside Mall")+t(80,280,"Central Park")+t(575,104,"Kanopi")+t(520,354,"Lake");
 g+=`<g transform="translate(440,48)" pointer-events="none"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="var(--accent)"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="var(--accent-ink)" font-family="Figtree,sans-serif">B</text></g>`;
 if(showFixes)S.forEach(s=>{if(s.fix&&(st.tried.has(s.id)||isBuilt(s))){const [x,y]=mid(s);g+=`<g transform="translate(${x-12},${y+12})" pointer-events="none"><circle r="8" fill="var(--surface)" stroke="var(--cool)" stroke-width="2"/><text y="4" text-anchor="middle" font-size="10" font-weight="800" fill="var(--cool)" font-family="Figtree,sans-serif">✓</text></g>`;}});
 if(showReports){const groups={};st.reports.filter(r=>r.status!=="Built"&&(!onlyMine||r.mine||r.follow)).forEach(r=>{(groups[r.sid]=groups[r.sid]||[]).push(r);});
  Object.entries(groups).forEach(([sid,rs])=>{const s=byId[sid];const [x,y]=mid(s);const n=rs.reduce((a,r)=>a+r.metoo+1,0);const k=KIND[rs[0].kind];const nw=rs.some(r=>r.fresh);
   g+=`<g transform="translate(${x+12},${y-12})" pointer-events="none">${nw?`<circle r="15" fill="var(--hot)" opacity=".25"/>`:""}<circle r="10" fill="${k.c}" stroke="var(--surface)" stroke-width="2"/><text y="3.5" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Figtree,sans-serif">${onlyMine?k.g:n}</text></g>`;});}
 if(home)g+=`<g transform="translate(340,250)" pointer-events="none"><circle r="14" fill="var(--host)" stroke="var(--surface)" stroke-width="3"/><path d="M-7,2 L0,-6 L7,2 L7,8 L-7,8 Z" fill="var(--host-ink)"/></g>`;
 if(pin){const k=KIND[pin.kind];g+=`<g transform="translate(${pin.x},${pin.y})" pointer-events="none"><path d="M0,0 C-14,-16 -14,-34 0,-34 C14,-34 14,-16 0,0 Z" fill="${k.c}" stroke="var(--surface)" stroke-width="3"/><text y="-18" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Figtree,sans-serif">${k.g}</text></g>`;}
 const se=byId[sel];if(se&&cls==="map"){const [x,y]=mid(se);const w=se.name.length*6.3+16;const vert=Math.abs(se.pts[0][0]-se.pts[se.pts.length-1][0])<20;let lx=vert?x+26:x-w/2,ly=vert?y-10:(y<40?y+16:y-36);lx=Math.min(Math.max(lx,4),636-w);g+=`<g pointer-events="none"><rect x="${lx}" y="${ly}" width="${w}" height="20" rx="6" fill="var(--ink)"/><text x="${lx+w/2}" y="${ly+14}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--bg)" font-family="Figtree,sans-serif">${esc(se.name)}</text></g>`;}
 if(attr&&attr!=="data-pick")S.forEach(s=>g+=`<path d="${pth(s)}" ${attr}="${s.id}" fill="none" stroke="transparent" stroke-width="26" stroke-linecap="round" style="cursor:pointer"><title>${esc(s.name)}</title></path>`);
 return `<svg class="${cls}${night?" night":""}" viewBox="${vb}" ${attr==="data-pick"?'data-pick="1" style="cursor:crosshair"':""} role="img" aria-label="Street map">${g}</svg>`;
}
function nearest(x,y){let best=null,bd=1e9;S.forEach(s=>{const p=s.pts;for(let i=1;i<p.length;i++){const [ax,ay]=p[i-1],[bx,by]=p[i];const dx=bx-ax,dy=by-ay;const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1)));const d=Math.hypot(ax+t*dx-x,ay+t*dy-y);if(d<bd){bd=d;best={sid:s.id,x:Math.round(ax+t*dx),y:Math.round(ay+t*dy)};}}});return best;}
const placeholderPhoto=(kind)=>{const k=KIND[kind];return `<svg viewBox="0 0 400 300" class="photo" role="img" aria-label="Photo"><rect width="400" height="300" fill="var(--surface-2)"/><rect y="190" width="400" height="110" fill="var(--block)"/><path d="M0,190 L400,190" stroke="var(--line)" stroke-width="3"/><circle cx="330" cy="70" r="34" fill="${kind==="dark"?"var(--night)":"var(--warm)"}" opacity=".8"/><rect x="40" y="110" width="14" height="80" fill="var(--muted)"/><text x="200" y="260" text-anchor="middle" font-family="Figtree,sans-serif" font-size="16" font-weight="700" fill="var(--muted)">${k.l}</text></svg>`;};

 try{const [reportsResponse,proposalsResponse]=await Promise.all([fetch('/api/reports'),fetch('/api/proposals')]);const [reportsBody,proposalsBody]=await Promise.all([reportsResponse.json(),proposalsResponse.json()]);if(!reportsResponse.ok||!proposalsResponse.ok)throw Error(reportsBody.error||proposalsBody.error||'Shared data unavailable');liveReports=reportsBody.reports;liveProposals=proposalsBody.proposals;liveServiceError='';}

 const keep=document.activeElement;const key=keep&&keep.dataset?Object.keys(keep.dataset)[0]:null;const selStart=keep&&keep.selectionStart;
 if(residentMap){residentMap.remove();residentMap=null;}
 const sw=`<div class="switch" role="group" aria-label="View">${[["staff","Sime Darby"],["resident","Resident"],["split","Side by side"]].map(([k,l])=>`<button data-view="${k}" aria-pressed="${st.view===k&&!(k==="resident"&&st.phone.qr)}">${l}</button>`).join("")}<button data-view="qr" aria-pressed="${st.view!=="staff"&&st.phone.qr}">QR</button><span class="sep"></span><button data-reset>Reset pitch</button><span class="sep"></span><a href="report.html?source=owner" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap">Report form</a><a href="sdp-app.html" style="display:inline-flex;align-items:center;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap">SDP app integration ↗</a></div>`;
 let body;
 if(st.view==="staff")body=staffHTML();
 else if(st.view==="resident")body=`<div class="stage">${phoneHTML()}</div>`;
 else body=`<div class="split">${staffHTML()}<div class="stage">${phoneHTML()}</div></div>`;
 const m=st.modal?(st.modal.kind?pitchModal():`<div class="modalwrap" data-mclose><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(st.modal.title)}"><h3>${esc(st.modal.title)}</h3>${st.modal.body||""}${st.modal.copy!=null?`<textarea readonly data-copytext>${esc(st.modal.copy)}</textarea>`:""}<div class="btns" style="justify-content:flex-end">${st.modal.copy!=null?`<button class="btn" data-copy>Copy</button>`:""}${st.modal.confirm?`<button class="btn" data-confirm>${esc(st.modal.confirm)}</button>`:""}<button class="btn ghost" data-mx>Close</button></div></div></div>`):"";
 root.innerHTML=sw+body+m+(st.toast?`<div class="toast" role="status">${esc(st.toast)}</div>`:"");
 mountResidentMap();
 if(key&&["hour","budget","replytext","pnote","wnote"].includes(key)){const n=root.querySelector(`[data-${key}]`);if(n){n.focus();try{if(selStart!=null&&n.setSelectionRange)n.setSelectionRange(selStart,selStart);}catch(e){}}}
}

/* ---------- events ---------- */
function openStreet(id){st.staff.drawer={type:"street",id};st.staff.bell=false;}
function openReport(id){const r=repById(id);r.fresh=false;st.staff.drawer={type:"report",id};st.staff.replyDraft="";st.staff.bell=false;}
function pgo(s){const p=st.phone;if(s===p.screen)return;p.hist.push(p.screen);p.screen=s;p.sheet=null;}
function readFile(input,cb){const f=input.files&&input.files[0];if(!f)return;if(f.size>8e6){toast("Photo is too large. Pick one under 8 MB.");render();return;}const fr=new FileReader();fr.onload=()=>cb(fr.result);fr.readAsDataURL(f);}

document.addEventListener("click",e=>{
 const t=e.target;
 if(t.closest&&t.closest('[data-map-retry]')){residentMapData=null;if(residentMap){residentMap.remove();residentMap=null;}mountResidentMap();return;}
 const proposalSave=t.closest&&t.closest('[data-live-proposal-save]');
 if(proposalSave){const card=proposalSave.closest('.live-report-item');const status=card.querySelector('[data-proposal-status]').value;proposalSave.disabled=true;
  fetch(`/api/proposals/${proposalSave.dataset.liveProposalSave}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}).then(async response=>{const body=await response.json();if(!response.ok)throw Error(body.error||'Could not save');toast('Proposal status updated');await refreshLiveReports();}).catch(error=>{toast(error.message);render();});return;}
 const liveSave=t.closest&&t.closest('[data-live-save]');
 if(liveSave){const card=liveSave.closest('.live-report-item');const status=card.querySelector('[data-live-status]').value;const reply=card.querySelector('[data-live-reply]').value.trim();liveSave.disabled=true;
  fetch(`/api/reports/${liveSave.dataset.liveSave}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reply})}).then(async response=>{const body=await response.json();if(!response.ok)throw Error(body.error||'Could not save');toast('Pilot report updated');await refreshLiveReports();}).catch(error=>{toast(error.message);render();});return;}
 const pick=t.closest&&t.closest("svg[data-pick]");
 if(pick){const pt=pick.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(pick.getScreenCTM().inverse());const n=nearest(q.x,q.y);Object.assign(st.phone.draft,{sid:n.sid,x:n.x,y:n.y});render();return;}
 const el=t.closest&&t.closest("[data-view],[data-reset],[data-nav],[data-bell],[data-avatar],[data-street],[data-report],[data-close],[data-mode],[data-layer],[data-toggle],[data-filter],[data-setstatus],[data-plan],[data-try],[data-period],[data-act],[data-mx],[data-mclose],[data-copy],[data-confirm],[data-pgo],[data-pback],[data-ptoast],[data-pstreet],[data-psheet],[data-preport],[data-home-metoo],[data-pkind],[data-pmetoo],[data-psend],[data-ptrack],[data-pfixed],[data-pnotif],[data-wkind],[data-wsend],[data-wagain]");
 if(!el)return;const d=el.dataset;
 if(d.mclose!==undefined&&el!==t)return; // clicks inside the modal box
 if(d.view){if(d.view==="qr"){st.phone.qr=true;if(st.view==="staff")st.view="split";}else{st.view=d.view;if(d.view!=="staff"){st.phone.qr=false;if(st.phone.screen==="host")st.phone.screen="home";}}render();return;}
 if(d.reset!==undefined){clearTimeout(fixTimer);st=seed();st.view="split";st.staff.screen="map";st.phone.screen="home";st.hour=12;st.budget=100000;window.scrollTo(0,0);toast("Pitch view ready");render();return;}
 /* staff */
 if(d.nav){st.staff.screen=d.nav;st.staff.drawer=null;st.staff.bell=false;st.staff.avatar=false;render();return;}
 if(d.bell!==undefined){st.staff.screen='reports';st.staff.bell=false;st.staff.avatar=false;render();return;}
 if(d.avatar!==undefined){st.staff.avatar=!st.staff.avatar;st.staff.bell=false;render();return;}
 if(d.street){openStreet(d.street);render();return;}
 if(d.report){openReport(d.report);render();return;}
 if(d.close!==undefined){st.staff.drawer=null;render();return;}
 if(d.mode){st.mode=d.mode;st.hour=d.mode==="day"?14:20;render();return;}
 if(d.layer){st.staff.layers[d.layer]=!st.staff.layers[d.layer];render();return;}
 if(d.toggle){const on=planSet().has(d.toggle);st.manual[d.toggle]=!on;render();return;}
 if(d.filter){st.staff.filter=d.filter;render();return;}
 if(d.period){st.staff.period=d.period;render();return;}
 if(d.plan){const on=planSet().has(d.plan);st.manual[d.plan]=!on;toast(on?"Removed from the fix plan":"Added to the fix plan");render();return;}
 if(d.try){st.tried.has(d.try)?st.tried.delete(d.try):st.tried.add(d.try);render();return;}
 if(d.setstatus){const r=repById(st.staff.drawer.id);if(r.status!==d.setstatus){r.status=d.setstatus;r.replies.push({who:"Township team",t:`Status changed to ${d.setstatus}.`,when:"just now"});
   const s=byId[r.sid];notifyResident(r,`${s.name} is now ${d.setstatus}`,d.setstatus==="Built"?"The fix is built. See the before and after.":d.setstatus==="Planned"?(s.fix?s.fix.label:"Added to the fix plan."):"The township team has seen your report.");
   if(d.setstatus==="Planned"&&s.fix)st.manual[s.id]=true;toast(r.mine||r.follow?"Status updated · resident notified":"Status updated");}render();return;}
 if(d.act){const a=d.act;
  if(a==="open-budget"){clearTimeout(fixTimer);clearTimeout(toastTimer);st.toast=null;st.modal={kind:'budget',budget:st.budget};render();return;}
  if(a==="back-find"){st.preview=false;render();return;}
  if(a==="reply"){const r=repById(st.staff.drawer.id);const txt=(st.staff.replyDraft||"").trim();if(!txt){toast("Write a reply first");render();return;}r.replies.push({who:"Township team",t:txt,when:"just now"});st.staff.replyDraft="";notifyResident(r,`Reply about ${byId[r.sid].name}`,txt);toast(r.mine||r.follow?"Reply sent · resident notified":"Reply sent");render();return;}
  if(a==="export"){const pick=planSet();st.modal={title:"Export fix plan (CSV)",copy:"street,fix,cost_rm,trips_per_day,value_per_rm10k\n"+FIXES.filter(s=>pick.has(s.id)).map(s=>[`"${s.name}"`,`"${s.fix.label}"`,s.fix.cost,daily(s),Math.round(value(s))].join(",")).join("\n")};render();return;}
  if(a==="council"){st.modal={title:"Council handoff",body:"<p>Export this plan for review. Council submissions require site checks and an approved process; this action does not send the plan.</p>"};render();return;}
  if(a==="summary"){const pick=planSet();let wk=0;pick.forEach(id=>wk+=daily(byId[id]));st.modal={title:"Impact summary",copy:`Elmina City Centre walking heat (Teduh)\nWalking routes shaded at 2pm: ${shadedPct()}% -> ${shadedPct(pick)}% after plan\nRed streets at 2pm: ${redCount()} -> ${redCount(pick)}\nTrips a day on fixed streets: ${wk}\nResident reports: ${st.reports.length}, closed: ${st.reports.filter(r=>r.status==="Built").length}`};render();return;}
  if(a==="autoplan"){st.manual={};toast("Plan reset to best value within budget");render();return;}
  if(a==="plancheck"){st.modal={title:"Plan check: Kulai",body:`<p>Upload a township layout (DWG, GeoJSON or PDF plan) and Teduh scores the future streets for shade and crossings before construction.</p><p class="note">Coming after the pilot.</p>`};render();return;}
  if(a==="signout"){st.staff.avatar=false;toast("Account menu closed");render();return;}
 }
 if(d.mx!==undefined||d.mclose!==undefined){clearTimeout(fixTimer);st.modal=null;render();return;}
 if(d.copy!==undefined){const txt=st.modal.copy;const ta=root.querySelector("[data-copytext]");const fallback=()=>{if(ta){ta.focus();ta.select();}toast("Selected. Press Ctrl or Cmd + C to copy");render();const n=root.querySelector("[data-copytext]");if(n){n.focus();n.select();}};
  try{navigator.clipboard.writeText(txt).then(()=>{toast("Copied");render();},fallback);}catch(err){fallback();}return;}
 if(d.confirm!==undefined){
  if(st.modal?.kind==='budget'){const budget=st.modal.budget;st.budget=budget;st.manual={};st.modal={kind:'calculating',budget};render();clearTimeout(fixTimer);fixTimer=setTimeout(()=>{if(st.modal?.kind==='calculating'&&st.modal.budget===budget){st.modal={kind:'result'};render();}},1300);return;}
  if(st.modal?.kind==='result'){st.preview=true;st.staff.screen='map';st.modal=null;render();return;}
  st.modal=null;render();return;}
 /* phone */
 const p=st.phone;
 if(d.pgo){if(d.pgo==="kind")p.draft=null;pgo(d.pgo);render();return;}
 if(d.pback!==undefined){p.screen=p.hist.pop()||"host";p.sheet=null;render();return;}
 if(d.ptoast){toast(`${d.ptoast} is an existing owner-app feature`);render();return;}
 if(d.pstreet){p.sheet=d.pstreet;render();return;}
 if(d.psheet!==undefined){p.sheet=null;render();return;}
 if(d.homeMetoo){const r=repById(d.homeMetoo);r.metoo++;r.follow=true;p.rid=r.id;p.metoo=true;p.hist=["host","home"];p.screen="sent";render();return;}
 if(d.preport){const s=byId[d.preport];const [x,y]=mid(s);p.draft={kind:null,sid:s.id,x,y,photo:null,note:""};pgo("kind");render();return;}
 if(d.pkind){if(!p.draft)p.draft={kind:null,sid:PILOT_STREET_ID,x:null,y:null,photo:null,note:""};p.draft.kind=d.pkind;pgo("pin");render();return;}
 if(d.pmetoo!==undefined){const ex=st.reports.filter(r=>r.sid===p.draft.sid&&r.kind===p.draft.kind&&r.status!=="Built").sort((a,b)=>b.metoo-a.metoo)[0];ex.metoo++;ex.follow=true;p.rid=ex.id;p.metoo=true;p.hist=["host","home"];p.screen="sent";render();return;}
 if(d.psend!==undefined){const dr=p.draft;const r={id:"R-"+(st.nextId++),sid:dr.sid,kind:dr.kind,metoo:0,age:"just now",status:"Received",note:dr.note||"",photo:dr.photo,src:"Owner app",mine:true,fresh:true,replies:[]};st.reports.unshift(r);p.rid=r.id;p.metoo=false;p.hist=["host","home"];p.screen="sent";toast("New report sent to the township team");render();return;}
 if(d.ptrack){p.rid=d.ptrack;p.banner=null;st.notifs.forEach(n=>{if(n.rid===d.ptrack)n.unread=false;});if(p.qr)p.qr=false;pgo("track");render();return;}
 if(d.pfixed){p.fixSid=d.pfixed;pgo("fixed");render();return;}
 if(d.pnotif){const n=st.notifs.find(x=>x.id===+d.pnotif);n.unread=false;if(n.kind==="heat"){pgo("home");}else{const r=repById(n.rid);if(r.status==="Built"){p.fixSid=r.sid;pgo("fixed");}else{p.rid=r.id;pgo("track");}}render();return;}
 if(d.wkind){p.web.kind=d.wkind;render();return;}
 if(d.wsend!==undefined){const r={id:"R-"+(st.nextId++),sid:"s6",kind:p.web.kind,metoo:0,age:"just now",status:"Received",note:p.web.note||"Reported at the bus stop sticker",photo:p.web.photo,src:"QR sticker",fresh:true,replies:[]};st.reports.unshift(r);p.web.sent=true;toast("QR report sent to the township team");render();return;}
 if(d.wagain!==undefined){p.web={kind:null,photo:null,sent:false};render();return;}
});
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset)return;
 if(t.dataset.pitchBudget!==undefined){st.modal.budget=+t.value;root.querySelector('[data-pitch-budget-value]').textContent=rmFull(st.modal.budget);root.querySelector('[data-pitch-summary]').innerHTML=pitchStats(st.modal.budget);}
 else if(t.dataset.hour!==undefined){st.hour=+t.value;render();}
 else if(t.dataset.budget!==undefined){st.budget=+t.value;render();}
 else if(t.dataset.replytext!==undefined){st.staff.replyDraft=t.value;}
 else if(t.dataset.pnote!==undefined){st.phone.draft.note=t.value;}
 else if(t.dataset.wnote!==undefined){st.phone.web.note=t.value;}
});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset)return;
 if(t.dataset.pphoto!==undefined)readFile(t,u=>{st.phone.draft.photo=u;render();});
 if(t.dataset.wphoto!==undefined)readFile(t,u=>{st.phone.web.photo=u;render();});
 if(t.dataset.township!==undefined&&t.value!=="Elmina City Centre"){const v2=t.value;t.value="Elmina City Centre";st.modal={title:v2,body:v2.startsWith("Kulai")?`<p>Plan check scores a township layout before it is built. Upload a layout to start.</p><p class="note">Coming after the pilot.</p>`:`<p>${esc(v2)} is not set up in this workspace yet.</p>`};render();}
});
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==root.querySelector('.real-map-frame')?.contentWindow||event.data?.type!=='teduh-hour')return;const hour=Number(event.data.hour);if(Number.isInteger(hour)&&hour>=7&&hour<=19)st.hour=hour;});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(st.modal){clearTimeout(fixTimer);st.modal=null;}else if(st.staff.drawer)st.staff.drawer=null;else{st.staff.bell=false;st.staff.avatar=false;}render();}});
render();
refreshLiveReports();
setInterval(refreshLiveReports,20000);
window.addEventListener('storage',event=>{if(event.key==='teduh-team-local-v1')refreshLiveReports();});
})();
</script>
