<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teduh in the Sime Darby Property App (concept)</title>
<link rel="icon" href="./assets/teduh-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--hdr:#2b2b2b;--red:#c3483b;--red2:#d9573f;--cream:#fbf3ea;--ink:#1d1d1d;--muted:#6b6b6b;--line:#ececec;--bg:#ffffff;--stage:#e9e6e2;--teduh:#12302a;
 --cool:#2e9d6c;--warm:#e0a019;--hot:#d2412a;--night:#4b5f8a;--brown:#7a6a58;--map:#eef0ec;--block:#dcdfd9;--park:#cfe6cf;--water:#cfe1ec}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;flex-direction:column;align-items:center;gap:12px;font-family:"Montserrat","Gotham","Helvetica Neue",Arial,sans-serif;background:var(--stage);color:var(--ink);display:flex;justify-content:flex-start;padding:16px 12px 24px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.concept{max-width:560px;text-align:center;font-size:12.5px;font-weight:600;color:#3a3a3a;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px 12px;line-height:1.4}.concept a{color:#c3483b}
.phone{width:390px;max-width:100%;height:min(844px,calc(100dvh - 112px));min-height:520px;background:var(--bg);border:10px solid #111;border-radius:48px;overflow:hidden;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);display:flex;flex-direction:column;flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.hdr{background:var(--hdr);border-radius:0 0 26px 26px;padding:40px 20px 22px;display:flex;align-items:center;gap:16px;color:#fff}
.hdr img{height:48px;display:block}
.hdr .sp{flex:1}
.ib{border:0;background:transparent;color:#fff;width:40px;height:40px;display:grid;place-items:center;position:relative;padding:0}
.ib .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--red2);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.av{width:52px;height:52px;border-radius:50%;background:#d9d9d9;border:0;display:grid;place-items:center;overflow:hidden;padding:0}
.sec{padding:22px 20px 8px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sh h2{margin:0;font-size:17px;font-weight:600}
.vl{border:0;background:none;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;color:var(--ink);padding:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.qa{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;text-align:center;line-height:1.25;color:var(--ink);padding:0;position:relative}
.circ{width:62px;height:62px;border-radius:50%;background:var(--cream);display:grid;place-items:center}
.qa .new{position:absolute;top:-6px;right:4px;background:var(--red2);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;letter-spacing:.03em}
.qa.hl .circ{box-shadow:0 0 0 2px var(--red2)}
.qa.hl .circ img{width:40px;height:40px;padding:4px;border-radius:10px;background:var(--teduh);object-fit:contain}
.div{height:8px;background:#f6f6f6;margin:18px 0 0;border-top:1px solid var(--line)}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 6px 16px -12px rgba(0,0,0,.25)}
.heat{background:linear-gradient(120deg,var(--red),#e8823d);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.heat b{font-size:34px;font-weight:800;line-height:1;display:block}
.heat small{font-size:12px;font-weight:500;opacity:.95}
.cardbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
svg.mm{display:block;width:100%;height:auto;border-radius:12px;background:var(--map)}
.btn{border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:600;font-size:15px;padding:14px;width:100%}
.btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ramp{display:inline-block;width:60px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cool),var(--warm),var(--hot));vertical-align:middle;margin:0 4px}
.voucher{width:200px}
.voucher .img{height:200px;background:linear-gradient(160deg,#c9a487,#7d5a45);display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;font-size:18px;line-height:1.2}
.vt{font-size:16px;font-weight:600;margin:10px 0 24px}
.top{background:var(--hdr);color:#fff;border-radius:0 0 22px 22px;padding:40px 16px 16px;display:flex;align-items:center;gap:12px}
.top .teduh-mark{width:30px;height:30px;padding:3px;border-radius:8px;background:var(--teduh);object-fit:contain;flex:none}
.back{border:0;background:rgba(255,255,255,.12);color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.top h1{margin:0;font-size:17px;font-weight:700}
.top small{display:block;font-size:11.5px;opacity:.75;font-weight:500}
.pad{padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px}
.row{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.row h3{margin:0;font-size:14px;font-weight:700}
.row p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-Received{background:#f1f1f1}.p-Seen{background:#e5e9f4;color:#33457a}.p-Planned{background:#fbecd2;color:#8a5a00}.p-Built{background:#dff1e8;color:#1d6b49}
.opt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.opt .circ{width:48px;height:48px;flex:none}
.opt b{display:block;font-size:14px}
.opt small{font-size:12px;color:var(--muted)}
.metoo{background:var(--cream);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px}
.metoo button{border:0;background:var(--red);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;white-space:nowrap}
.upl{border:1.5px dashed #d8d8d8;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;position:relative}
.upl input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover}
textarea{width:100%;border:1px solid #dedede;border-radius:12px;padding:10px 12px;resize:none;min-height:60px}
.ok{width:76px;height:76px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;margin:24px auto 0}
.center{text-align:center}
.center h2{margin:8px 0 4px;font-size:22px}
.center p{margin:0;color:var(--muted);font-size:13px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:16px;position:relative}
.steps li::after{content:"";position:absolute;left:13px;top:26px;bottom:2px;width:2px;background:#e6e6e6}
.steps li:last-child::after{display:none}
.sd{width:28px;height:28px;border-radius:50%;border:2px solid #ddd;display:grid;place-items:center;font-size:12px;font-weight:800;color:#999;background:#fff;z-index:1}
.sd.done{background:var(--red);border-color:var(--red);color:#fff}
.sd.now{border-color:var(--red);color:var(--red)}
.steps b{display:block;font-size:14px}
.steps span{font-size:12px;color:var(--muted)}
.reply{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:13px}
.reply small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.notif{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;text-align:left;width:100%;background:#fff}
.notif.un{background:var(--cream);border-color:#f0dccb}
.notif b{display:block;font-size:13.5px}
.notif span{font-size:12px;color:var(--muted)}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;white-space:nowrap;z-index:10}
.sheet{background:var(--cream);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
@media (max-width:480px){body{height:100dvh;min-height:0;padding:0;background:var(--bg);gap:0}.concept{border-radius:0;border-width:0 0 1px;max-width:none;width:100%;flex:none}.phone{border:0;border-radius:0;height:auto;min-height:0;width:100%;flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

 if(tap)S.forEach((s,i)=>g+=`<path d="${P(s)}" data-tap="${i}" fill="none" stroke="transparent" stroke-width="26" stroke-linecap="round" style="cursor:pointer"/>`);
 return `<svg class="mm" viewBox="0 0 640 440" ${pick?'data-pick="1" style="cursor:crosshair"':""} role="img" aria-label="Map of streets near your home">${g}</svg>`;}
function nearest(x,y){let best=null,bd=1e9;S.forEach((s,si)=>{const p=s[1];for(let i=1;i<p.length;i++){const [ax,ay]=p[i-1],[bx,by]=p[i];const dx=bx-ax,dy=by-ay;const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1)));const d=Math.hypot(ax+t*dx-x,ay+t*dy-y);if(d<bd){bd=d;best={si,x:Math.round(ax+t*dx),y:Math.round(ay+t*dy)};}}});return best;}

function seed(){return{screen:"home",hist:[],toast:null,draft:null,rid:null,sheet:null,
 reports:[{id:"R-1041",si:3,kind:"hot",n:24,status:"Planned",mine:false,follow:true,note:"No shade at 1pm pick-up",reply:"Thank you. A shade sail and a raised crossing are planned for March."},
          {id:"R-1022",si:7,kind:"hot",n:4,status:"Received",mine:true,note:"New trees give no shade yet",reply:""},
          {id:"R-1035",si:10,kind:"dark",n:10,status:"Built",follow:true,note:"Too dark to jog after Maghrib",reply:"8 solar lights are now installed."},
          {id:"R-1038",si:5,kind:"hot",n:7,status:"Seen",note:"Bus stop roof too small",reply:""}],
 notifs:[{t:"Heat alert: 36°C expected tomorrow",b:"Schools pause outdoor activities above 35°C. The north side of Jalan Sekolah is shaded until 3pm.",go:"street",un:true},
         {t:"Jalan Elmina 3 is now Planned",b:"Shade sail and raised crossing, planned for March.",rid:"R-1041",un:true},
         {t:"Lingkaran Taman: fix built",b:"8 solar lights installed.",rid:"R-1035",un:false}],next:1042};}
let st=seed();const app=document.getElementById("app");let tt=null;
function toast(t){st.toast=t;clearTimeout(tt);tt=setTimeout(()=>{st.toast=null;render();},2400);}
const top=(t,s)=>`<div class="top"><button class="back" data-back aria-label="Back">‹</button>${t==='My Street'?'<img class="teduh-mark" src="./assets/teduh-icon.svg" width="30" height="30" alt="">':''}<div><h1>${t}</h1><small>${s}</small></div></div>`;
const pill=s=>`<span class="pill p-${s}">${s}</span>`;
const unread=()=>st.notifs.filter(n=>n.un).length;

const V={
home:()=>`<div class="hdr"><img src="${LOGO}" alt="Sime Darby Property"><span class="sp"></span><button class="ib" data-toast="My vouchers" aria-label="Vouchers">${I.ticket}</button><button class="ib" data-go="notifs" aria-label="Notifications">${I.bell}${unread()?`<span class="dot">${unread()}</span>`:""}</button><button class="av" data-toast="Profile" aria-label="Profile">${I.person}</button></div>
 <div class="sec"><div class="sh"><h2>Quick Access</h2><button class="vl" data-toast="View Less">View Less ${I.chev}</button></div>
 <div class="grid">
  ${[["search","New Property Search"],["mall","Mall"],["enquiry","General Enquiry"]].map(([i,l])=>`<button class="qa" data-toast="${l}"><span class="circ">${I[i]}</span>${l}</button>`).join("")}
  <button class="qa hl" data-go="street"><span class="new">NEW</span><span class="circ"><img src="./assets/teduh-icon.svg" width="40" height="40" alt=""></span>My Street</button>
  ${[["news","News & Media Gallery"],["events","Events"],["hash","Stay Connected"],["referral","Referral Programme"],["qr","Scan QR Code"]].map(([i,l])=>`<button class="qa" data-toast="${l}"><span class="circ">${I[i]}</span>${l}</button>`).join("")}
 </div></div>
 <div class="div"></div>
 <div class="sec"><div class="sh"><h2>My Street</h2><button class="vl" data-go="street" style="color:var(--red);font-weight:600">See all</button></div>
  <div class="card"><div class="heat"><div><small>Today in Elmina</small><b>34°C</b><small>Hottest 1–4pm · MET Malaysia</small></div><small style="text-align:right">Tomorrow<br><b style="font-size:20px;display:inline">36°C</b></small></div>
  <div class="cardbody">${map()}<div class="legend"><span>Streets near home, 2pm</span><span>shady<span class="ramp"></span>sun</span></div><button class="btn" data-go="kind">Report a street</button></div></div></div>
 <div class="div"></div>
 <div class="sec"><div class="sh"><h2>Mall Vouchers</h2></div><button class="card voucher" data-toast="Mall voucher" style="padding:0;border:0;text-align:left;background:none;box-shadow:none"><div class="img" style="border-radius:12px">RM30 OFF<br><span style="font-size:11px;font-weight:500">MINIMUM RM300 SPEND</span></div><div class="vt">RM30 OFF</div></button></div>`,
street:()=>{const sh=st.sheet!=null?S[st.sheet]:null;const near=st.reports.filter(r=>(r.follow||r.mine)&&(r.status==="Planned"||r.status==="Built"));
 return `${top("My Street","Elmina City Centre · Teduh")}<div class="pad">
 <div class="card"><div class="heat"><div><small>Today in Elmina</small><b>34°C</b><small>Hottest 1–4pm</small></div><small style="text-align:right">No heat alert<br>today</small></div></div>
 ${map({tap:true})}<div class="legend"><span>Tap a street</span><span>shady<span class="ramp"></span>sun</span></div>
 ${sh?`<div class="sheet"><b>${esc(sh[0])}</b><span style="font-size:12px;color:var(--muted)">${st.reports.filter(r=>r.si===st.sheet).reduce((a,r)=>a+r.n,0)} residents asking</span><button class="btn" data-reportat="${st.sheet}" style="padding:10px">Report a problem here</button></div>`:""}
 <button class="btn" data-go="kind">Report a street problem</button>
 <button class="row" data-go="mine"><div><h3>My reports</h3><p>${st.reports.filter(r=>r.mine).length} sent · ${st.reports.filter(r=>r.follow).length} followed</p></div><span>›</span></button>
 <h3 style="margin:4px 0 0;font-size:15px">Being fixed near you</h3>
 ${near.map(r=>`<button class="row" data-track="${r.id}"><div><h3>${esc(S[r.si][0])}</h3><p>${esc(r.reply||KIND[r.kind].l)}</p></div>${pill(r.status)}</button>`).join("")}</div>`;},
kind:()=>`${top("Report a street","Step 1 of 2 · What's the problem?")}<div class="pad">${Object.entries(KIND).map(([k,o])=>`<button class="opt" data-kind="${k}"><span class="circ" style="font-size:20px;color:${o.c};font-weight:800">${o.g}</span><span><b>${o.l}</b><small>${o.d}</small></span></button>`).join("")}<p style="font-size:12px;color:var(--muted)">Reports go to the Sime Darby township team. Neighbours don't see your name.</p></div>`,
pin:()=>{const d=st.draft;const ex=d.si!=null?st.reports.filter(r=>r.si===d.si&&r.status!=="Built"):[];const n=ex.reduce((a,r)=>a+r.n,0);
 return `${top("Report a street","Step 2 of 2 · Where and what")}<div class="pad">${map({colour:false,pick:true,pin:d.x!=null?{x:d.x,y:d.y,kind:d.kind}:null})}
 <p style="margin:0;font-size:13px">${d.si!=null?`<b>${esc(S[d.si][0])}</b> · ${KIND[d.kind].l}`:"Tap the street on the map"}</p>
 ${n?`<div class="metoo"><span><b>${n} neighbours</b> already reported this street.</span><button data-metoo>Me too</button></div>`:""}
 <label class="upl">${d.photo?`<img class="thumb" src="${d.photo}" alt="Your photo">`:""}<span>${d.photo?"Change photo":"Add a photo"}</span><span>optional</span><input type="file" accept="image/*" data-photo></label>
 <textarea data-note placeholder="Add a note (optional)">${esc(d.note||"")}</textarea>
 <button class="btn" data-send ${d.si!=null?"":"disabled"}>Send report</button></div>`;},
sent:()=>{const r=st.reports.find(x=>x.id===st.rid);return `${top("Report sent",esc(S[r.si][0]))}<div class="pad center"><div class="ok">✓</div><h2>${st.metoo?"Added your voice":"Thank you"}</h2><p>${r.n} resident${r.n>1?"s":""} now asking for ${esc(S[r.si][0])}. The township team will see it on their map.</p><button class="btn" data-track="${r.id}">Track this report</button><button class="btn ghost" data-go="home">Back to Home</button></div>`;},
track:()=>{const r=st.reports.find(x=>x.id===st.rid);const idx=STAT.indexOf(r.status);const sub=["Your report reached the team","Usually within a week","Added to the fix plan with a cost","You get a before and after"];
 return `${top("Your report",esc(S[r.si][0])+" · "+r.id)}<div class="pad">
 <div class="row" style="cursor:default"><div style="display:flex;gap:12px;align-items:center"><span class="ic" style="background:${KIND[r.kind].c}">${KIND[r.kind].g}</span><div><h3>${KIND[r.kind].l}</h3><p>${r.n} resident${r.n>1?"s":""} asking</p></div></div>${pill(r.status)}</div>
 ${r.photo?`<img src="${r.photo}" alt="Your photo" style="width:100%;border-radius:12px;max-height:160px;object-fit:cover">`:""}
 <ol class="steps">${STAT.map((s,i)=>`<li><span class="sd ${i<=idx?"done":i===idx+1?"now":""}">${i<=idx?"✓":i+1}</span><div><b>${s==="Seen"?"Seen by the township team":s}</b><span>${sub[i]}</span></div></li>`).join("")}</ol>
 ${r.reply?`<div class="reply"><small>Sime Darby township team</small>${esc(r.reply)}</div>`:""}
 <button class="btn ghost" data-go="street">Back to My Street</button></div>`;},
mine:()=>`${top("My reports","Sent and followed")}<div class="pad">${st.reports.filter(r=>r.mine||r.follow).map(r=>`<button class="row" data-track="${r.id}"><div style="display:flex;gap:12px;align-items:center"><span class="ic" style="background:${KIND[r.kind].c}">${KIND[r.kind].g}</span><div><h3>${esc(S[r.si][0])}</h3><p>${r.mine?"You reported":"You followed"}</p></div></div>${pill(r.status)}</button>`).join("")}<button class="btn" data-go="kind">Report another problem</button></div>`,
notifs:()=>`${top("Notifications","Updates from Sime Darby Property")}<div class="pad">${st.notifs.map((n,i)=>`<button class="notif ${n.un?"un":""}" data-notif="${i}"><span class="ic" style="background:${n.rid?RED:"#e8823d"}">${n.rid?"✓":"☀"}</span><span><b>${esc(n.t)}</b><span>${esc(n.b)}</span></span></button>`).join("")}</div>`
};
function render(){const key=document.activeElement&&document.activeElement.dataset?Object.keys(document.activeElement.dataset)[0]:null;
 app.innerHTML=V[st.screen]()+(st.toast?`<div class="toast" role="status">${esc(st.toast)}</div>`:"");
 if(key==="note"){const n=app.querySelector("[data-note]");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}}}
function go(s){if(s===st.screen)return;st.hist.push(st.screen);st.screen=s;st.sheet=null;app.scrollTop=0;}
app.addEventListener("click",e=>{
 const pk=e.target.closest("svg[data-pick]");
 if(pk){const pt=pk.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(pk.getScreenCTM().inverse());const n=nearest(q.x,q.y);Object.assign(st.draft,{si:n.si,x:n.x,y:n.y});render();return;}
 const b=e.target.closest("[data-go],[data-back],[data-toast],[data-kind],[data-metoo],[data-send],[data-track],[data-notif],[data-tap],[data-reportat]");if(!b)return;const d=b.dataset;
 if(d.go){if(d.go==="kind")st.draft={kind:null,si:null,x:null,y:null,photo:null,note:""};go(d.go);render();return;}
 if(d.back!==undefined){st.screen=st.hist.pop()||"home";st.sheet=null;render();return;}
 if(d.toast){toast(`${d.toast} is an existing app feature`);render();return;}
 if(d.tap){st.sheet=+d.tap;render();return;}
 if(d.reportat){const s=S[+d.reportat];const [x,y]=mid(s);st.draft={kind:null,si:+d.reportat,x,y,photo:null,note:""};go("kind");render();return;}
 if(d.kind){st.draft.kind=d.kind;go("pin");render();return;}
 if(d.metoo!==undefined){const r=st.reports.filter(x=>x.si===st.draft.si&&x.status!=="Built").sort((a,b)=>b.n-a.n)[0];r.n++;r.follow=true;st.rid=r.id;st.metoo=true;st.hist=["home"];st.screen="sent";render();return;}
 if(d.send!==undefined){const dr=st.draft;const r={id:"R-"+(st.next++),si:dr.si,kind:dr.kind,n:1,status:"Received",mine:true,note:dr.note,photo:dr.photo,reply:""};st.reports.unshift(r);st.rid=r.id;st.metoo=false;st.hist=["home"];st.screen="sent";render();return;}
 if(d.track){st.rid=d.track;go("track");render();return;}
 if(d.notif){const n=st.notifs[+d.notif];n.un=false;if(n.rid){st.rid=n.rid;go("track");}else go(n.go);render();return;}
});
app.addEventListener("input",e=>{if(e.target.dataset.note!==undefined)st.draft.note=e.target.value;});
app.addEventListener("change",e=>{const t=e.target;if(t.dataset.photo!==undefined){const f=t.files&&t.files[0];if(!f)return;if(f.size>8e6){toast("Photo too large (max 8 MB)");render();return;}const fr=new FileReader();fr.onload=()=>{st.draft.photo=fr.result;render();};fr.readAsDataURL(f);}});
render();
})();
</script>
</body></html>
